# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from Conventional Commits.

[changelog]
# template for the changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
The format is based on [Conventional Commits](https://www.conventionalcommits.org/),
and this changelog is generated automatically by [git-cliff](https://git-cliff.org/).\n
"""
# template for the changelog body
# https://git-cliff.org/docs/template
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading "<type>(<scope>): " part of a commit message
trim = true
# render the changelog even when there are no tags yet
render_always = true

# parse the commits based on https://www.conventionalcommits.org
[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^revert", group = "Revert" },
]
protect_breaking_commits = false
filter_commits = false
# regex for matching git tags that group releases
tag_pattern = "v[0-9]*"
# tags to exclude from the changelog
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
